#Ai Config
spring.application.name=aiApp
server.port=8080

# ---------------------------------------------------------------
# Spring AI: choose which chat model(s) are active.
# With both starters on the classpath you get two ChatModel beans,
# and injecting a plain ChatClient.Builder / ChatModel will fail with
# an ambiguity error. Uncomment ONE line to activate a single provider:
# ---------------------------------------------------------------
#spring.ai.model.chat=openai
# spring.ai.model.chat=google-genai

# ---------------------------------------------------------------
# OpenAI
# Set the key as an environment variable (OPENAI_API_KEY), never commit it.
# ---------------------------------------------------------------
spring.ai.openai.api-key=
spring.ai.openai.base-url=https://openrouter.ai/api/v1
#spring.ai.openai.chat.completions-path=/v1/chat/completions
#    LLM Model
spring.ai.openai.chat.options.model=nvidia/nemotron-3.5-lightning:free
#    Embedding Model
spring.ai.openai.embedding.options.model=nvidia/nemotron-3.5-embed-1b:free



# ---------------------------------------------------------------
# Google GenAI (Gemini)
# Set the key as an environment variable (GOOGLE_API_KEY).
# ---------------------------------------------------------------
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.7
spring.ai.google.genai.chat.options.thinking-budget=0
#spring.ai.google.genai.chat.options.thinking-level=Medium


# ---------------------------------------------------------------
# Postgres Vector Database
# ---------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5433/playlist_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# ---------------------------------------------------------------
# Logging (handy while debugging AI calls)
# ---------------------------------------------------------------
logging.level.org.springframework.ai=DEBUG
